services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lamansion
      POSTGRES_USER: lamansion
      POSTGRES_PASSWORD: change-this-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U lamansion -d lamansion"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 8787
      APP_ORIGIN: http://localhost:8787
      DATABASE_URL: postgresql://lamansion:change-this-password@db:5432/lamansion
      DATABASE_SSL: "false"
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
